name: Build Windows ARM64 package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing GitHub Release tag to upload this package to (e.g. v1.2.0).'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      SIGNING_ENABLED: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt ARM64
        id: qt-target
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_arm64_cross_compiled
          dir: ${{ runner.temp }}/Qt
          cache: true
          setup-python: false

      - name: Save Qt ARM64 path
        shell: pwsh
        run: |
          if (-not $env:QT_ROOT_DIR) { throw 'The Qt ARM64 installation path was not set.' }
          "QT_TARGET_ROOT=$env:QT_ROOT_DIR" >> $env:GITHUB_ENV

      - name: Install Qt host tools
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.temp }}/Qt
          cache: true
          setup-python: false

      - name: Save Qt host path
        shell: pwsh
        run: |
          $hostRoot = Join-Path $env:RUNNER_TEMP 'Qt\Qt\6.8.3\msvc2022_64'
          if (-not (Test-Path $hostRoot)) { throw "The Qt host installation was not found at $hostRoot" }
          "QT_HOST_ROOT=$hostRoot" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Configure and build
        shell: pwsh
        run: |
          $widgetsTools = Get-ChildItem (Join-Path $env:QT_HOST_ROOT 'lib\cmake') -Filter 'Qt6WidgetsToolsConfig.cmake' -Recurse | Select-Object -First 1
          if (-not $widgetsTools) { throw "Qt6WidgetsToolsConfig.cmake was not found under $env:QT_HOST_ROOT" }
          $widgetsToolsDir = $widgetsTools.DirectoryName
          Write-Host "Using Qt host tools from $env:QT_HOST_ROOT"
          cmake -S . -B build-arm64 -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:QT_TARGET_ROOT/lib/cmake/Qt6/qt.toolchain.cmake" `
            -DCMAKE_PREFIX_PATH="$env:QT_TARGET_ROOT;$env:QT_HOST_ROOT" `
            -DQT_HOST_PATH="$env:QT_HOST_ROOT" `
            -DQt6WidgetsTools_DIR="$widgetsToolsDir"
          cmake --build build-arm64 --parallel

      - name: Sign executable
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CERT_PASSWORD) {
            throw 'WINDOWS_CERT_PASSWORD must be set when WINDOWS_CERT_PFX_BASE64 is configured.'
          }

          $signtool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' -and ($_.Directory.Parent.Name -as [version]) } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK.' }

          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
            $signed = $false
            foreach ($timestamp in @('http://timestamp.digicert.com', 'http://timestamp.sectigo.com')) {
              & $signtool sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr $timestamp /td SHA256 'build-arm64\at-pet.exe'
              if ($LASTEXITCODE -eq 0) { $signed = $true; break }
            }
            if (-not $signed) { throw 'signtool could not sign at-pet.exe.' }

            & $signtool verify /pa 'build-arm64\at-pet.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed.' }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'Signed and verified at-pet.exe.'

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = $env:QT_TARGET_ROOT
          $package = Join-Path $env:GITHUB_WORKSPACE 'dist\At-Pet-windows-arm64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'build-arm64\at-pet.exe' $package
          Copy-Item 'LICENSE' $package

          foreach ($dll in @('Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Network.dll', 'Qt6Svg.dll', 'Qt6Widgets.dll')) {
            Copy-Item (Join-Path $target "bin\$dll") $package
          }

          $plugins = @{
            generic = @('qtuiotouchplugin.dll')
            iconengines = @('qsvgicon.dll')
            imageformats = @('qgif.dll', 'qico.dll', 'qjpeg.dll', 'qsvg.dll')
            networkinformation = @('qnetworklistmanager.dll')
            platforms = @('qwindows.dll')
            styles = @('qmodernwindowsstyle.dll')
            tls = @('qcertonlybackend.dll', 'qschannelbackend.dll')
          }
          foreach ($category in $plugins.Keys) {
            $destination = Join-Path $package $category
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            foreach ($plugin in $plugins[$category]) {
              Copy-Item (Join-Path $target "plugins\$category\$plugin") $destination
            }
          }

          foreach ($dll in @('D3Dcompiler_47.dll', 'dxcompiler.dll', 'dxil.dll', 'opengl32sw.dll')) {
            $source = Join-Path $target "bin\$dll"
            if (Test-Path $source) { Copy-Item $source $package }
          }

          Invoke-WebRequest 'https://aka.ms/vs/17/release/vc_redist.arm64.exe' -OutFile (Join-Path $package 'vc_redist.arm64.exe')
          @'
          At-Pet for Windows ARM64

          Built for Windows 10/11 on ARM64.
          If the Microsoft Visual C++ ARM64 Redistributable is not installed, run vc_redist.arm64.exe first.
          Then start at-pet.exe.
          '@ | Set-Content -Path (Join-Path $package 'README.txt') -Encoding utf8

          function Get-PeMachine($path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            return [BitConverter]::ToUInt16($bytes, $offset + 4)
          }
          $binaries = @((Join-Path $package 'at-pet.exe')) + @(Get-ChildItem $package -Recurse -Filter '*.dll' | ForEach-Object { $_.FullName })
          foreach ($file in $binaries) {
            $machine = Get-PeMachine $file
            if ($machine -ne 0xaa64) { throw "$file is not an ARM64 binary (PE machine 0x$('{0:x}' -f $machine))." }
          }

          $zip = Join-Path $env:GITHUB_WORKSPACE 'dist\At-Pet-windows-arm64.zip'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  At-Pet-windows-arm64.zip" | Set-Content -Path "$zip.sha256" -Encoding ascii

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = $env:RELEASE_TAG
            if (-not $tag.StartsWith('v')) { throw 'A workflow-dispatch release tag must start with v.' }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            if (-not $env:GITHUB_REF.StartsWith('refs/tags/v')) {
              throw "The requested release $tag does not exist; refusing to create it from a manual run."
            }
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "At-Pet $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
              if ($LASTEXITCODE -ne 0) { throw "Could not create or find release $tag." }
            }
          }
          gh release upload $tag dist/At-Pet-windows-arm64.zip dist/At-Pet-windows-arm64.zip.sha256 --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the Windows ARM64 package to release $tag." }
